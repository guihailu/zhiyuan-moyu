name: Mobile navigation guard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify accessible mobile navigation across five pages
        run: python3 tools/mobile_nav_guard.py
