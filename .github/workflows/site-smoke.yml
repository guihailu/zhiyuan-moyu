name: 官网基础验收（云端只读）
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Five-page smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify static paths and mobile navigation
        run: python3 tools/site_smoke.py
